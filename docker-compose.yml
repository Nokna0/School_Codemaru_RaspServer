services:
  nginx:
    image: nokna/nginx:latest
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy   # app이 헬스 통과한 뒤에 기동
    networks:
      - webnet
    restart: unless-stopped

  app:
    image: nokna/app:latest
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/data/square.db
      - UPLOAD_DIR=/data/uploads
      - NEIS_API_KEY=${NEIS_API_KEY}
      - NEIS_ATPT_OFCDC_SC_CODE=${NEIS_ATPT_OFCDC_SC_CODE:-M10}
      - NEIS_SD_SCHUL_CODE=${NEIS_SD_SCHUL_CODE}
      - SIGNUP_CODES=${SIGNUP_CODES}
    volumes:
      - square-data:/data          # SQLite DB + 업로드 영구 보존 (없으면 재시작 시 소실!)
    networks:
      - webnet
    restart: unless-stopped
    # 헬스체크: node 내장 fetch(slim 이미지엔 curl/wget 없음). /api/health 200이면 healthy.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - autoheal=true               # unhealthy 시 autoheal이 자동 재시작

  # 컨테이너가 unhealthy로 떨어지면 자동 재시작(plain compose는 unhealthy 자동복구 미지원 보완).
  autoheal:
    image: willfarrell/autoheal:latest
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - webnet
    restart: unless-stopped

networks:
  webnet:
    driver: bridge

volumes:
  square-data:
